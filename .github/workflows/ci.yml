name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run motion tests
        run: ./test.sh
      - name: Build isolated test app
        env:
          EDGE_ODYSSEY_BUNDLE_ID: dev.edgeodyssey.ci
          EDGE_ODYSSEY_VERSION: 0.3.0-ci
        run: ./build.sh
      - name: Verify universal executable
        run: lipo 'build/Edge Odyssey.app/Contents/MacOS/EdgeOdyssey' -verify_arch arm64 x86_64
      - name: Verify app signature
        run: codesign --verify --deep --strict "build/Edge Odyssey.app"
